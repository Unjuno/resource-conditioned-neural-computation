name: RTNN Ibex RTL timing validation

on:
  pull_request:
    paths:
      - '.github/workflows/rtnn-ibex-rtl.yml'
      - 'experiments/realtime_nn_real_sequence_fixed_core.c'
      - 'experiments/realtime_nn_real_sequence_fixed_core.h'
      - 'experiments/realtime_nn_rv32_cycle_envelope.py'
      - 'experiments/ibex_rtl/**'
      - 'notes/realtime_nn_ibex_rtl_validation.md'
      - 'results/realtime_nn_ibex_rtl_validation_results.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ibex-rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact audited seed-63 Q15 artifact
        run: |
          set -euxo pipefail
          test "$(find experiments/ibex_rtl -maxdepth 1 -name 'seed63_q15.b64.*' | wc -l)" -eq 18
          mkdir -p build/ibex-rtnn
          cat experiments/ibex_rtl/seed63_q15.b64.* | base64 -d | gzip -dc > build/ibex-rtnn/realtime_nn_real_sequence_fixed_weights_generated.h
          echo '4aa108a79cc578271e063f80530ad921d8b9fc07ff1c1f9ad4772a75fec479ed  build/ibex-rtnn/realtime_nn_real_sequence_fixed_weights_generated.h' | sha256sum -c -

      - name: Install RTL and compiler dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends verilator libelf-dev srecord clang lld llvm python3-venv make g++ git
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install fusesoc
          verilator --version
          clang --version | head -1

      - name: Pin and build stock Ibex RTL configuration
        run: |
          set -euxo pipefail
          git clone https://github.com/lowRISC/ibex.git ibex
          git -C ibex checkout 7b5df75a041affe56e8c235260f98a09b3319008
          . .venv/bin/activate
          python -m pip install -r ibex/python-requirements.txt
          cd ibex
          OPTS="$(util/ibex_config.py small fusesoc_opts)"
          OPTS="${OPTS/--RV32M=ibex_pkg::RV32MFast/--RV32M=ibex_pkg::RV32MSingleCycle}"
          OPTS="${OPTS/--SecureIbex=0/--SecureIbex=1}"
          echo "$OPTS" | tee "$GITHUB_WORKSPACE/build/ibex-rtnn/ibex_config.txt"
          grep -q -- '--WritebackStage=0' <<<"$OPTS"
          grep -q -- '--ICache=0' <<<"$OPTS"
          grep -q -- '--RV32M=ibex_pkg::RV32MSingleCycle' <<<"$OPTS"
          grep -q -- '--SecureIbex=1' <<<"$OPTS"
          fusesoc --cores-root=. run --target=sim --setup --build lowrisc:ibex:ibex_simple_system $OPTS

      - name: Build exact RTNN bare-metal certification ELF
        run: |
          set -euxo pipefail
          COMMON='--target=riscv32-unknown-elf -march=rv32im_zicsr -mabi=ilp32 -mno-relax -O2 -ffreestanding -fno-builtin -fno-stack-protector -fno-pic -nostdlib'
          clang $COMMON -Ibuild/ibex-rtnn -Iexperiments -c experiments/realtime_nn_real_sequence_fixed_core.c -o build/ibex-rtnn/core.o
          clang $COMMON -Iexperiments -c experiments/ibex_rtl/rtnn_ibex_main.c -o build/ibex-rtnn/main.o
          clang $COMMON -c experiments/ibex_rtl/rtnn_ibex_start.S -o build/ibex-rtnn/start.o
          ld.lld -m elf32lriscv --no-relax -T experiments/ibex_rtl/rtnn_ibex_link.ld build/ibex-rtnn/start.o build/ibex-rtnn/core.o build/ibex-rtnn/main.o -o build/ibex-rtnn/rtnn_ibex.elf
          llvm-size build/ibex-rtnn/rtnn_ibex.elf
          test -z "$(llvm-nm -u build/ibex-rtnn/rtnn_ibex.elf)"
          test -z "$(llvm-objdump -d build/ibex-rtnn/core.o | grep -E '\b(div|divu|rem|remu|flw|fsw|fadd|fmul|fdiv)\b' || true)"
          sha256sum build/ibex-rtnn/rtnn_ibex.elf | tee build/ibex-rtnn/rtl_elf.sha256

      - name: Compute static envelope for exact RTL ELF
        run: |
          set -euxo pipefail
          python experiments/ibex_rtl/realtime_nn_ibex_rtl_cycle_envelope.py build/ibex-rtnn/rtnn_ibex.elf --out build/ibex-rtnn/static_envelope.json
          cat build/ibex-rtnn/static_envelope.json

      - name: Run RTNN on pinned stock Ibex RTL
        run: |
          set -euxo pipefail
          SIM=ibex/build/lowrisc_ibex_ibex_simple_system_0/sim-verilator/Vibex_simple_system
          test -x "$SIM"
          "$SIM" --meminit=ram,"$GITHUB_WORKSPACE/build/ibex-rtnn/rtnn_ibex.elf" | tee build/ibex-rtnn/simulator_stdout.log
          LOG=ibex_simple_system.log
          test -f "$LOG" || LOG=ibex/ibex_simple_system.log
          test -f "$LOG"
          cp "$LOG" build/ibex-rtnn/ibex_simple_system.log
          cat build/ibex-rtnn/ibex_simple_system.log

      - name: Compare RTL cycles with exact static envelope
        run: |
          set -euxo pipefail
          python experiments/ibex_rtl/realtime_nn_ibex_rtl_parse.py --log build/ibex-rtnn/ibex_simple_system.log --static build/ibex-rtnn/static_envelope.json --out build/ibex-rtnn/rtl_validation.json
          cat build/ibex-rtnn/rtl_validation.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtnn-ibex-rtl-validation
          path: |
            build/ibex-rtnn/ibex_config.txt
            build/ibex-rtnn/rtl_elf.sha256
            build/ibex-rtnn/static_envelope.json
            build/ibex-rtnn/ibex_simple_system.log
            build/ibex-rtnn/simulator_stdout.log
            build/ibex-rtnn/rtl_validation.json
