name: Ibex RTL validation

on:
  pull_request:
    paths:
      - '.github/workflows/ibex-rtl-validation.yml'
      - 'experiments/realtime_nn_real_sequence_fixed_*'
      - 'experiments/realtime_nn_ibex_*'
      - 'experiments/export_realtime_nn_real_sequence_fixed_q15.py'
      - 'experiments/export_realtime_nn_ibex_rtl_vectors.py'
      - 'results/realtime_nn_fixed_time_target_results.json'
  workflow_dispatch:

jobs:
  rtl-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      IBEX_COMMIT: 7b5df75a041affe56e8c235260f98a09b3319008
      EXPECTED_MODEL_SHA: b53c6dbc270d0f95e9959bdc2eacb1608b91496437a7b4b159fda3e74e7b488a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install model-export dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 scikit-learn==1.8.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Regenerate the exact seed-63 Q15 artifact and RTL vectors
        run: |
          mkdir -p "$RUNNER_TEMP/rtnn"
          cd experiments
          python export_realtime_nn_real_sequence_fixed_q15.py --seed 63 --steps 700 --outdir "$RUNNER_TEMP/rtnn" | tee "$RUNNER_TEMP/q15_export.txt"
          python export_realtime_nn_ibex_rtl_vectors.py --outdir "$RUNNER_TEMP/rtnn"
          python - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'rtnn','realtime_nn_real_sequence_fixed_meta.json')
          m=json.load(open(p))
          exp=os.environ['EXPECTED_MODEL_SHA']
          assert m['canonical_model_sha256']==exp,(m['canonical_model_sha256'],exp)
          print('canonical model SHA:',m['canonical_model_sha256'])
          PY

      - name: Build and run native integer reference
        run: |
          cc -O2 -std=c11 -Iexperiments -I"$RUNNER_TEMP/rtnn" \
            experiments/realtime_nn_real_sequence_fixed_core.c \
            experiments/realtime_nn_ibex_host_reference.c \
            -o "$RUNNER_TEMP/rtnn_host_reference"
          "$RUNNER_TEMP/rtnn_host_reference" | tee "$RUNNER_TEMP/host.csv"

      - name: Install RTL and RISC-V build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator libelf-dev srecord gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf g++ make
          python -m pip install fusesoc
          verilator --version
          fusesoc --version
          riscv64-unknown-elf-gcc --version | head -1

      - name: Fetch pinned Ibex RTL
        run: |
          git init "$RUNNER_TEMP/ibex"
          cd "$RUNNER_TEMP/ibex"
          git remote add origin https://github.com/lowRISC/ibex.git
          git fetch --depth 1 origin "$IBEX_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$IBEX_COMMIT"

      - name: Build exact bare-metal RTNN validation ELF
        run: |
          riscv64-unknown-elf-gcc -O2 -std=c11 -march=rv32im_zicsr -mabi=ilp32 \
            -ffreestanding -fno-builtin -fno-stack-protector -ffunction-sections -fdata-sections \
            -mno-relax -nostdlib -Wl,--no-relax -Wl,--gc-sections \
            -Wl,-T,experiments/realtime_nn_ibex_simple_system.ld \
            -Iexperiments -I"$RUNNER_TEMP/rtnn" \
            experiments/realtime_nn_ibex_start.S \
            experiments/realtime_nn_real_sequence_fixed_core.c \
            experiments/realtime_nn_real_sequence_fixed_timing_contract.c \
            experiments/realtime_nn_ibex_rtl_harness.c \
            -o "$RUNNER_TEMP/rtnn_ibex_rtl.elf"
          riscv64-unknown-elf-size "$RUNNER_TEMP/rtnn_ibex_rtl.elf"
          test -z "$(riscv64-unknown-elf-nm -u "$RUNNER_TEMP/rtnn_ibex_rtl.elf")"
          riscv64-unknown-elf-objcopy -O binary "$RUNNER_TEMP/rtnn_ibex_rtl.elf" "$RUNNER_TEMP/rtnn_ibex_rtl.bin"
          sha256sum "$RUNNER_TEMP/rtnn_ibex_rtl.elf" "$RUNNER_TEMP/rtnn_ibex_rtl.bin" | tee "$RUNNER_TEMP/rtl_binary_sha256.txt"

      - name: Build pinned Ibex Simple System
        run: |
          cd "$RUNNER_TEMP/ibex"
          fusesoc --cores-root=. run --target=sim --setup --build \
            lowrisc:ibex:ibex_simple_system \
            --RV32E=0 \
            --RV32M=ibex_pkg::RV32MSingleCycle \
            --RV32B=ibex_pkg::RV32BNone \
            --RV32ZC=ibex_pkg::RV32Zca \
            --RegFile=ibex_pkg::RegFileFF \
            --INSTR_CYCLE_DELAY=0 \
            --ICache=0 --ICacheECC=0 --ICacheScramble=0 \
            --BranchTargetALU=0 --WritebackStage=0 --BranchPredictor=0 \
            --SecureIbex=1 --DbgTriggerEn=0 --PMPEnable=0 \
            --MHPMCounterNum=10 --MHPMCounterWidth=40
          find build -type f -name Vibex_simple_system -print

      - name: Run RTNN on pinned Ibex RTL
        run: |
          cd "$RUNNER_TEMP/ibex"
          SIM="$(find build -type f -name Vibex_simple_system | head -1)"
          test -n "$SIM"
          "$SIM" --meminit=ram,"$RUNNER_TEMP/rtnn_ibex_rtl.elf" | tee "$RUNNER_TEMP/ibex_sim_stdout.txt"
          test -f ibex_simple_system.log
          cp ibex_simple_system.log "$RUNNER_TEMP/ibex_simple_system.log"
          if test -f ibex_simple_system_pcount.csv; then cp ibex_simple_system_pcount.csv "$RUNNER_TEMP/"; fi
          cat "$RUNNER_TEMP/ibex_simple_system.log"

      - name: Compare RTL cycles and predictions with the conditional model
        run: |
          python experiments/compare_realtime_nn_ibex_rtl.py \
            --host "$RUNNER_TEMP/host.csv" \
            --rtl "$RUNNER_TEMP/ibex_simple_system.log" \
            --conditional-results results/realtime_nn_fixed_time_target_results.json \
            --out "$RUNNER_TEMP/realtime_nn_ibex_rtl_validation_results.json"

      - name: Upload RTL validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ibex-rtl-validation
          path: |
            ${{ runner.temp }}/realtime_nn_ibex_rtl_validation_results.json
            ${{ runner.temp }}/ibex_simple_system.log
            ${{ runner.temp }}/ibex_sim_stdout.txt
            ${{ runner.temp }}/ibex_simple_system_pcount.csv
            ${{ runner.temp }}/host.csv
            ${{ runner.temp }}/rtl_binary_sha256.txt
            ${{ runner.temp }}/rtnn_ibex_rtl.elf
            ${{ runner.temp }}/q15_export.txt
          if-no-files-found: warn
