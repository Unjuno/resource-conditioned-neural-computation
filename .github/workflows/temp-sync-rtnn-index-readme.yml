name: TEMP sync RTNN index and README

on:
  push:
    branches:
      - agent/software-formal-closure
    paths:
      - '.github/workflows/temp-sync-rtnn-index-readme.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/software-formal-closure
          fetch-depth: 1

      - name: Apply current-state documentation synchronization
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('EXPERIMENT_INDEX.md')
          s = p.read_text()
          old = "| **Pinned Simple-System LUT memory timing** | **PASS_WITH_SCOPE** | exact ELF: all four input-indexed memory sites remain aligned `LW`; both exp/GELU LUTs are wholly inside the 1 MiB RAM; all 12,290 legal LUT word addresses uniquely decode to RAM; Yosys netlist of pinned `ram_2p` shows `a_rvalid_o` is one request-register stage with zero address fan-in, closing address-dependent response timing for this memory model |\n| **CBMC finite runtime contract**"
          new = "| **Pinned Simple-System LUT memory timing** | **PASS_WITH_SCOPE** | exact ELF: all four input-indexed memory sites remain aligned `LW`; both exp/GELU LUTs are wholly inside the 1 MiB RAM; all 12,290 legal LUT word addresses uniquely decode to RAM; Yosys netlist of pinned `ram_2p` shows `a_rvalid_o` is one request-register stage with zero address fan-in, closing address-dependent response timing for this memory model |\n| **Durable exact certification artifact** | **PASS** | the exact Ibex timing/binary/memory evidence package is frozen in Git; ZIP/ELF/BIN hashes are pinned and CI derives the board-free reference directly from the frozen package rather than relying on Actions retention |\n| **CBMC finite runtime contract**"
          if old not in s:
              raise SystemExit('index memory-row anchor changed')
          s = s.replace(old, new, 1)

          old = "    -> pinned Simple-System LUT memory-timing audit\n    -> CBMC finite runtime-contract proof"
          new = "    -> pinned Simple-System LUT memory-timing audit\n    -> durable exact certification artifact identity\n    -> CBMC finite runtime-contract proof"
          if old not in s:
              raise SystemExit('index chain anchor changed')
          s = s.replace(old, new, 1)

          old = "1. Preserve the exact artifact/build identity durably; Actions artifacts are supporting evidence, not a long-term certification archive.\n2. If one more software/formal layer is desired before hardware, target processor-level proof/certification methodology rather than repeating input sampling or generic Linux timing."
          new = "1. Keep the Git-frozen certification package, its ZIP/ELF/BIN hashes, derived board-free vectors, and claim documents synchronized in CI.\n2. If one more software/formal layer is desired before hardware, target processor-level proof/certification methodology rather than repeating input sampling or generic Linux timing."
          if old not in s:
              raise SystemExit('index priority anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          marker = "## Current evidence snapshot"
          if marker not in s:
              anchor = "See [`REALTIME_NN_DIRECTION.md`](REALTIME_NN_DIRECTION.md).\n"
              if anchor not in s:
                  raise SystemExit('README direction anchor changed')
              block = r'''

## Current evidence snapshot

The main line has progressed well beyond the early routing/host-timing experiments below. Current strongest evidence is summarized in [`CLAIMS_AND_LIMITS.md`](CLAIMS_AND_LIMITS.md), [`EXPERIMENT_INDEX.md`](EXPERIMENT_INDEX.md), and [`EXPERIMENT_PLAN_REALTIME_NN.md`](EXPERIMENT_PLAN_REALTIME_NN.md).

Current same-model chain:

```text
held-out real sequence model
  -> continuous normalized budget b in [0,1]
  -> seven finite maximum-work classes
  -> Q15 fixed-iteration freestanding C
  -> pinned Ibex RTL cycle binding
  -> exact-RV32 custom + independent BINSEC control-flow audits
  -> pinned Simple-System deterministic LUT-memory timing audit
  -> CBMC finite/deployed control proofs
  -> deadline-admission interface
```

Key current boundaries:

- held-out real-sequence adaptive result: **93.56% accuracy at 20.23% mean physical compute** over formal seeds 60--64;
- pinned Ibex fixed classes have exact-build measured cycle counts with **zero input-to-input cycle range across three held-out inputs per class**;
- independent BINSEC fixed-class control-flow checks pass **933,653 / 933,653**;
- all **12,290** legal exp/GELU LUT word addresses are bound to the deterministic one-cycle Simple-System RAM path;
- CBMC proves the finite/deployed source control envelope over its represented complete finite domains;
- the exact Ibex certification package is frozen under `artifacts/certification/ibex_simple_system/` and CI verifies its ZIP/ELF/BIN identity;
- **DE0-CV has not yet been tested**. The next physical experiment is preregistered in [`notes/realtime_nn_de0_cv_next_stage.md`](notes/realtime_nn_de0_cv_next_stage.md): same seed-63 Q15 seven-class contract, Ibex softcore + controlled on-chip RAM + fixed clock, then a new FPGA-specific timing table and deadline-admission test.

The historical sections below are retained because negative results and intermediate mechanism evidence are part of the research record; they should not be read as the current evidence ceiling.
'''
              s = s.replace(anchor, anchor + block, 1)
              p.write_text(s)
          PY
          git diff --check
          git diff -- EXPERIMENT_INDEX.md README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXPERIMENT_INDEX.md README.md
          git commit -m 'Sync RTNN index and README with software closure'
          git push origin HEAD:agent/software-formal-closure
