# Template used by the third-party BINSEC cross-check.
# Substitute __CLASS__ with the concrete finite class 0..6.
# The exact RTL-tested ELF is analyzed directly, starting at
# rtnn_fixed_certify_class (0x1018f4).

starting from 0x1018f4 with
  ra := 0xdeadbee0;
  sp := 0x001d0000;
  a0 := 0x001c0000;
  a1 := 0x001e0000;
  a2 := __CLASS__;
  a3 := 0x001b0000;
  @[0x001e0000, 64] := secret as neural_input;
end

halt at 0xdeadbee0
explore all
